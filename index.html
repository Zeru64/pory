<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Porygon Card Database</title>
<style>
  :root{
    --bg:#000000;
    --fg:#ffffff;
    --fg-secondary:#9a9a9a;
    --pink:#ff5ca8;
    --cyan:#57d9ff;
    --line:#2a2a2a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--fg);
    font-family:Arial, Helvetica, "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  button{
    font-family:inherit;
    cursor:pointer;
  }
  header{
    padding:40px 24px 24px 24px;
    border-bottom:1px solid var(--line);
    text-align:center;
  }
  header h1{
    margin:0;
    font-size:18px;
    font-weight:normal;
    letter-spacing:4px;
    text-transform:uppercase;
  }
  main{
    max-width:1200px;
    margin:0 auto;
    padding:0 24px;
  }
  section{
    padding:56px 0;
  }
  #art-section{
    border-bottom:1px solid var(--line);
  }
  .section-title{
    font-size:13px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--cyan);
    margin:0 0 32px 0;
    font-weight:normal;
  }

  /* ---------- ART GRID ---------- */
  .art-grid{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:24px;
  }
  .art-item{
    background:none;
    border:none;
    padding:0;
    text-align:left;
    color:inherit;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .art-thumb{
    width:100%;
    aspect-ratio:5/7;
    overflow:hidden;
    border:1px solid var(--line);
    background:#0a0a0a;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:border-color .15s ease;
  }
  .art-item:hover .art-thumb{
    border-color:var(--pink);
  }
  .art-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .art-thumb .fallback{
    font-size:11px;
    color:var(--fg-secondary);
    padding:8px;
    text-align:center;
  }
  .art-name{
    font-size:12px;
    color:var(--fg-secondary);
    letter-spacing:.3px;
  }
  .art-item:hover .art-name{
    color:var(--fg);
  }

  /* ---------- STATS ---------- */
  .stats-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    margin-bottom:48px;
  }
  .stat-cell{
    background:var(--bg);
    padding:18px 16px;
  }
  .stat-label{
    font-size:10px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--fg-secondary);
    margin-bottom:8px;
  }
  .stat-value{
    font-size:20px;
    color:var(--fg);
  }
  .stat-value .accent{
    color:var(--pink);
  }

  /* ---------- FILTERS ---------- */
  .filters{
    display:flex;
    flex-wrap:wrap;
    gap:16px;
    align-items:end;
    padding:20px 0;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    margin-bottom:16px;
  }
  .filter-field{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .filter-field label{
    font-size:10px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--fg-secondary);
  }
  .filter-field select{
    background:var(--bg);
    color:var(--fg);
    border:1px solid var(--line);
    padding:6px 8px;
    font-size:13px;
    font-family:inherit;
    min-width:140px;
  }
  .filter-field select:focus{
    outline:1px solid var(--cyan);
  }
  .clear-btn{
    background:var(--bg);
    color:var(--pink);
    border:1px solid var(--pink);
    padding:7px 14px;
    font-size:12px;
    letter-spacing:.5px;
    text-transform:uppercase;
  }
  .clear-btn:hover{
    background:var(--pink);
    color:var(--bg);
  }

  .results-count{
    font-size:12px;
    color:var(--fg-secondary);
    margin-bottom:16px;
  }

  /* ---------- TABLE ---------- */
  .table-wrap{
    overflow-x:auto;
  }
  table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
  }
  thead th{
    text-align:left;
    font-size:10px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--fg-secondary);
    padding:10px 12px;
    border-bottom:1px solid var(--line);
    font-weight:normal;
  }
  tbody td{
    padding:10px 12px;
    border-bottom:1px solid var(--line);
  }
  tbody tr:hover{
    background:#0a0a0a;
  }
  .variant-link{
    background:none;
    border:none;
    color:var(--fg);
    padding:0;
    font-size:13px;
    text-align:left;
    text-decoration:underline;
    text-decoration-color:var(--line);
    text-underline-offset:3px;
  }
  .variant-link:hover{
    color:var(--pink);
    text-decoration-color:var(--pink);
  }

  .empty-note, .error-note{
    color:var(--fg-secondary);
    font-size:13px;
    padding:24px 0;
  }

  /* ---------- MODALS ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    z-index:1000;
  }
  .modal-box{
    background:var(--bg);
    border:1px solid var(--pink);
    max-width:900px;
    width:100%;
    max-height:86vh;
    overflow-y:auto;
    padding:28px;
    position:relative;
  }
  .modal-close{
    position:absolute;
    top:14px;
    right:16px;
    background:none;
    border:none;
    color:var(--fg-secondary);
    font-size:22px;
    line-height:1;
    padding:4px 8px;
  }
  .modal-close:hover{
    color:var(--pink);
  }
  .modal-title{
    font-size:13px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--cyan);
    margin:0 0 20px 0;
    padding-right:32px;
  }

  /* art modal table */
  .modal-box table{
    margin-top:8px;
  }

  /* card modal */
  .card-modal-body{
    display:flex;
    gap:32px;
    align-items:flex-start;
  }
  .card-modal-img{
    flex:0 0 260px;
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0a0a0a;
    min-height:200px;
  }
  .card-modal-img img{
    width:100%;
    display:block;
  }
  .card-modal-details{
    flex:1;
    min-width:0;
  }
  .detail-row{
    display:flex;
    justify-content:space-between;
    gap:16px;
    padding:8px 0;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .detail-row .k{
    color:var(--fg-secondary);
    letter-spacing:.5px;
    text-transform:uppercase;
    font-size:11px;
    padding-top:2px;
    white-space:nowrap;
  }
  .detail-row .v{
    text-align:right;
  }

  @media (max-width:900px){
    .art-grid{grid-template-columns:repeat(3,1fr);}
    .stats-grid{grid-template-columns:repeat(2,1fr);}
    .card-modal-body{flex-direction:column;}
    .card-modal-img{flex:none;width:100%;}
  }
  @media (max-width:560px){
    .art-grid{grid-template-columns:repeat(2,1fr);gap:14px;}
    .stats-grid{grid-template-columns:repeat(2,1fr);}
    header h1{font-size:14px;letter-spacing:2px;}
    section{padding:36px 0;}
  }
</style>
</head>
<body>

<header>
  <h1>Porygon Card Database</h1>
</header>

<main>

  <section id="art-section">
    <h2 class="section-title">Art Set</h2>
    <div id="art-grid" class="art-grid"></div>
  </section>

  <section id="collection-section">
    <h2 class="section-title">Collection Data</h2>

    <div id="stats-grid" class="stats-grid"></div>

    <h2 class="section-title">All Variants</h2>

    <form id="filters" class="filters">
      <div class="filter-field">
        <label for="f-set">Set</label>
        <select id="f-set"><option value="">All</option></select>
      </div>
      <div class="filter-field">
        <label for="f-lang">Language</label>
        <select id="f-lang"><option value="">All</option></select>
      </div>
      <div class="filter-field">
        <label for="f-variant">Variant</label>
        <select id="f-variant"><option value="">All</option></select>
      </div>
      <div class="filter-field">
        <label for="f-status">Status</label>
        <select id="f-status"><option value="">All</option></select>
      </div>
      <div class="filter-field">
        <label for="f-foil">Foil</label>
        <select id="f-foil"><option value="">All</option></select>
      </div>
      <div class="filter-field">
        <label for="f-year">Year</label>
        <select id="f-year"><option value="">All</option></select>
      </div>
      <button type="button" id="clear-filters" class="clear-btn">Clear filters</button>
    </form>

    <div id="results-count" class="results-count"></div>

    <div class="table-wrap">
      <table id="all-variants-table">
        <thead>
          <tr>
            <th>Set</th>
            <th>Language</th>
            <th>Variant</th>
          </tr>
        </thead>
        <tbody id="all-variants-body"></tbody>
      </table>
    </div>
    <div id="table-empty" class="empty-note" style="display:none;">No variants match the current filters.</div>
  </section>

</main>

<div id="modal-root"></div>

<script>
(function(){

  var CARDS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vROatNXdyuDhFaYun-TbAhhhF5DYG3K3vc6-CfRrv_asoLdxp31XO9GmX41yS-gzQ/pub?gid=1891749757&single=true&output=csv";
  var LEGEND_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vROatNXdyuDhFaYun-TbAhhhF5DYG3K3vc6-CfRrv_asoLdxp31XO9GmX41yS-gzQ/pub?gid=657860837&single=true&output=csv";

  // ---------------- CSV PARSER ----------------
  function parseCSV(text){
    var rows = [];
    var row = [];
    var field = "";
    var inQuotes = false;
    var i = 0;
    var len = text.length;

    while(i < len){
      var c = text[i];

      if(inQuotes){
        if(c === '"'){
          if(text[i+1] === '"'){
            field += '"';
            i += 2;
            continue;
          } else {
            inQuotes = false;
            i++;
            continue;
          }
        } else {
          field += c;
          i++;
          continue;
        }
      } else {
        if(c === '"'){
          inQuotes = true;
          i++;
          continue;
        } else if(c === ','){
          row.push(field);
          field = "";
          i++;
          continue;
        } else if(c === '\r'){
          i++;
          continue;
        } else if(c === '\n'){
          row.push(field);
          rows.push(row);
          row = [];
          field = "";
          i++;
          continue;
        } else {
          field += c;
          i++;
          continue;
        }
      }
    }
    // last field/row
    if(field.length > 0 || row.length > 0){
      row.push(field);
      rows.push(row);
    }

    // remove fully empty trailing rows
    rows = rows.filter(function(r){
      return !(r.length === 1 && r[0].trim() === "");
    });

    if(rows.length === 0) return [];

    var headers = rows[0].map(function(h){ return h.trim(); });
    var records = [];
    for(var r = 1; r < rows.length; r++){
      var rec = {};
      var rr = rows[r];
      if(rr.length === 1 && rr[0].trim() === "") continue;
      for(var c2 = 0; c2 < headers.length; c2++){
        rec[headers[c2]] = (rr[c2] !== undefined) ? rr[c2].trim() : "";
      }
      records.push(rec);
    }
    return records;
  }

  // ---------------- STATE ----------------
  var cards = [];
  var legend = {
    status: {},   // st_id -> Status name
    language: {}, // lan_id -> Language name
    art: {}       // art_id -> {name, url}
  };
  var artOrder = []; // ordered unique art_ids present in Cards

  function variantLabel(foil, variation){
    foil = (foil || "").trim();
    variation = (variation || "").trim();
    if(foil && variation) return foil + " — " + variation;
    if(foil && !variation) return foil;
    if(!foil && variation) return variation;
    return "Regular";
  }

  function statusName(code){
    if(!code) return "—";
    return legend.status[code] || code;
  }

  function langName(code){
    if(!code) return "—";
    return legend.language[code] || code;
  }

  function artInfo(artId){
    return legend.art[artId] || { name: artId || "Unknown", url: "" };
  }

  // ---------------- LOAD ----------------
  function loadData(){
    Promise.all([
      fetch(CARDS_CSV_URL).then(function(r){
        if(!r.ok) throw new Error("Cards fetch failed: " + r.status);
        return r.text();
      }),
      fetch(LEGEND_CSV_URL).then(function(r){
        if(!r.ok) throw new Error("Legend fetch failed: " + r.status);
        return r.text();
      })
    ]).then(function(results){
      var cardsRaw = parseCSV(results[0]);
      var legendRaw = parseCSV(results[1]);

      cards = cardsRaw.filter(function(row){
        return row.Code && row.Code.trim() !== "";
      });

      legendRaw.forEach(function(row){
        if(row.st_id && row.st_id.trim() !== ""){
          legend.status[row.st_id.trim()] = (row.Status || "").trim();
        }
        if(row.lan_id && row.lan_id.trim() !== ""){
          legend.language[row.lan_id.trim()] = (row.Language || "").trim();
        }
        if(row.art_id && row.art_id.trim() !== ""){
          legend.art[row.art_id.trim()] = {
            name: (row.art_set || "").trim() || row.art_id.trim(),
            url: (row.art_url || "").trim()
          };
        }
      });

      // build ordered unique art_id list from Cards
      var seen = {};
      cards.forEach(function(c){
        var aid = (c.art_id || "").trim();
        if(aid && !seen[aid]){
          seen[aid] = true;
          artOrder.push(aid);
        }
      });

      init();
    }).catch(function(err){
      console.error(err);
      showLoadError();
    });
  }

  function showLoadError(){
    var artGrid = document.getElementById("art-grid");
    artGrid.innerHTML = '<div class="error-note">Unable to load the collection data.</div>';
    var statsGrid = document.getElementById("stats-grid");
    statsGrid.innerHTML = '<div class="error-note">Unable to load the collection data.</div>';
    document.getElementById("table-empty").style.display = "block";
    document.getElementById("table-empty").textContent = "Unable to load the collection data.";
    document.getElementById("results-count").textContent = "";
  }

  // ---------------- INIT / RENDER ----------------
  function init(){
    renderArtGrid();
    renderStats();
    populateFilters();
    renderTable();
    bindFilterEvents();
    bindGlobalModalEvents();
  }

  // ---- ART GRID ----
  function renderArtGrid(){
    var grid = document.getElementById("art-grid");
    grid.innerHTML = "";

    if(artOrder.length === 0){
      grid.innerHTML = '<div class="empty-note">No art data available.</div>';
      return;
    }

    artOrder.forEach(function(artId){
      var info = artInfo(artId);
      var btn = document.createElement("button");
      btn.className = "art-item";
      btn.type = "button";
      btn.setAttribute("aria-label", "View variants for " + info.name);

      var thumb = document.createElement("div");
      thumb.className = "art-thumb";

      if(info.url){
        var img = document.createElement("img");
        img.src = info.url;
        img.alt = info.name;
        img.loading = "lazy";
        img.onerror = function(){
          thumb.innerHTML = '<span class="fallback">' + escapeHtml(info.name) + '</span>';
        };
        thumb.appendChild(img);
      } else {
        thumb.innerHTML = '<span class="fallback">' + escapeHtml(info.name) + '</span>';
      }

      var name = document.createElement("div");
      name.className = "art-name";
      name.textContent = info.name;

      btn.appendChild(thumb);
      btn.appendChild(name);
      btn.addEventListener("click", function(){
        openArtModal(artId);
      });

      grid.appendChild(btn);
    });
  }

  // ---- STATS ----
  function isGotOrOrdered(status){
    return status === "G" || status === "O";
  }

  function renderStats(){
    var total = cards.length;
    var gotOrOrdered = cards.filter(function(c){ return isGotOrOrdered(c.Status); }).length;
    var ordered = cards.filter(function(c){ return c.Status === "O"; }).length;
    var seenEvidence = cards.filter(function(c){ return c.Status === "S" || c.Status === "E"; }).length;
    var completion = total > 0 ? (gotOrOrdered / total * 100) : 0;

    // art completion
    var totalArts = artOrder.length;
    var gotArts = 0;
    artOrder.forEach(function(artId){
      var hasGot = cards.some(function(c){
        return (c.art_id || "").trim() === artId && isGotOrOrdered(c.Status);
      });
      if(hasGot) gotArts++;
    });
    var artCompletion = totalArts > 0 ? (gotArts / totalArts * 100) : 0;

    // language completion
    var allLangs = {};
    cards.forEach(function(c){
      var l = (c.Lang || "").trim();
      if(l) allLangs[l] = true;
    });
    var langCodes = Object.keys(allLangs);
    var totalLangs = langCodes.length;
    var gotLangs = 0;
    langCodes.forEach(function(l){
      var hasGot = cards.some(function(c){
        return (c.Lang || "").trim() === l && isGotOrOrdered(c.Status);
      });
      if(hasGot) gotLangs++;
    });
    var langCompletion = totalLangs > 0 ? (gotLangs / totalLangs * 100) : 0;

    var stats = [
      { label: "Universal Set", value: gotOrOrdered + " / " + total },
      { label: "Completion", value: completion.toFixed(1) + "%" },
      { label: "Art Set", value: gotArts + " / " + totalArts },
      { label: "Art Completion", value: artCompletion.toFixed(1) + "%" },
      { label: "Languages", value: gotLangs + " / " + totalLangs },
      { label: "Language Completion", value: langCompletion.toFixed(1) + "%" },
      { label: "Ordered", value: String(ordered) },
      { label: "Seen / Evidence", value: String(seenEvidence) },
      { label: "Total Variants", value: String(total) }
    ];

    var grid = document.getElementById("stats-grid");
    grid.innerHTML = "";
    stats.forEach(function(s){
      var cell = document.createElement("div");
      cell.className = "stat-cell";
      cell.innerHTML = '<div class="stat-label">' + escapeHtml(s.label) + '</div>' +
                        '<div class="stat-value">' + escapeHtml(s.value) + '</div>';
      grid.appendChild(cell);
    });
  }

  // ---- FILTERS ----
  function uniqueSorted(arr){
    var seen = {};
    var out = [];
    arr.forEach(function(v){
      if(v !== "" && v !== undefined && v !== null && !seen[v]){
        seen[v] = true;
        out.push(v);
      }
    });
    out.sort(function(a,b){ return String(a).localeCompare(String(b)); });
    return out;
  }

  function populateFilters(){
    var sets = uniqueSorted(cards.map(function(c){ return c.Set; }));
    var langCodes = uniqueSorted(cards.map(function(c){ return c.Lang; }));
    var foils = uniqueSorted(cards.map(function(c){ return c.Foil; }));
    var years = uniqueSorted(cards.map(function(c){ return c.Year; }));

    // variant options: unique concatenated labels
    var variantSet = {};
    cards.forEach(function(c){
      variantSet[variantLabel(c.Foil, c.Variation)] = true;
    });
    var variants = Object.keys(variantSet).sort(function(a,b){ return a.localeCompare(b); });

    // status options: unique status codes present in Cards
    var statusCodes = uniqueSorted(cards.map(function(c){ return c.Status; }));

    fillSelect("f-set", sets, function(v){ return v; });
    fillSelect("f-lang", langCodes, function(v){ return langName(v); });
    fillSelect("f-variant", variants, function(v){ return v; });
    fillSelect("f-status", statusCodes, function(v){ return statusName(v); });
    fillSelect("f-foil", foils, function(v){ return v; });
    fillSelect("f-year", years, function(v){ return v; });
  }

  function fillSelect(id, values, labelFn){
    var select = document.getElementById(id);
    values.forEach(function(v){
      var opt = document.createElement("option");
      opt.value = v;
      opt.textContent = labelFn(v);
      select.appendChild(opt);
    });
  }

  function getFilteredCards(){
    var setVal = document.getElementById("f-set").value;
    var langVal = document.getElementById("f-lang").value;
    var variantVal = document.getElementById("f-variant").value;
    var statusVal = document.getElementById("f-status").value;
    var foilVal = document.getElementById("f-foil").value;
    var yearVal = document.getElementById("f-year").value;

    return cards.filter(function(c){
      if(setVal && c.Set !== setVal) return false;
      if(langVal && c.Lang !== langVal) return false;
      if(variantVal && variantLabel(c.Foil, c.Variation) !== variantVal) return false;
      if(statusVal && c.Status !== statusVal) return false;
      if(foilVal && c.Foil !== foilVal) return false;
      if(yearVal && c.Year !== yearVal) return false;
      return true;
    });
  }

  function bindFilterEvents(){
    ["f-set","f-lang","f-variant","f-status","f-foil","f-year"].forEach(function(id){
      document.getElementById(id).addEventListener("change", renderTable);
    });
    document.getElementById("clear-filters").addEventListener("click", function(){
      ["f-set","f-lang","f-variant","f-status","f-foil","f-year"].forEach(function(id){
        document.getElementById(id).value = "";
      });
      renderTable();
    });
  }

  // ---- TABLE ----
  function renderTable(){
    var filtered = getFilteredCards();
    var tbody = document.getElementById("all-variants-body");
    tbody.innerHTML = "";

    var emptyNote = document.getElementById("table-empty");

    if(filtered.length === 0){
      emptyNote.style.display = "block";
    } else {
      emptyNote.style.display = "none";
    }

    filtered.forEach(function(c){
      var tr = document.createElement("tr");

      var tdSet = document.createElement("td");
      tdSet.textContent = c.Set || "—";

      var tdLang = document.createElement("td");
      tdLang.textContent = langName(c.Lang);

      var tdVariant = document.createElement("td");
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "variant-link";
      btn.textContent = variantLabel(c.Foil, c.Variation);
      btn.addEventListener("click", function(){
        openCardModal(c.Code);
      });
      tdVariant.appendChild(btn);

      tr.appendChild(tdSet);
      tr.appendChild(tdLang);
      tr.appendChild(tdVariant);
      tbody.appendChild(tr);
    });

    document.getElementById("results-count").textContent =
      "Showing " + filtered.length + " of " + cards.length + " variants";
  }

  // ---------------- MODALS ----------------
  var modalRoot = document.getElementById("modal-root");
  var lastFocusedElement = null;

  function lockScroll(){
    document.body.style.overflow = "hidden";
  }
  function unlockScroll(){
    document.body.style.overflow = "";
  }

  function closeAllModals(){
    modalRoot.innerHTML = "";
    unlockScroll();
    if(lastFocusedElement){
      lastFocusedElement.focus();
      lastFocusedElement = null;
    }
  }

  function bindGlobalModalEvents(){
    document.addEventListener("keydown", function(e){
      if(e.key === "Escape"){
        if(modalRoot.children.length > 0){
          closeAllModals();
        }
      }
    });
  }

  function openArtModal(artId){
    lastFocusedElement = document.activeElement;
    var info = artInfo(artId);
    var rows = cards.filter(function(c){ return (c.art_id || "").trim() === artId; });

    rows.sort(function(a, b){
      var s = (a.Set || "").localeCompare(b.Set || "");
      if(s !== 0) return s;
      var l = langName(a.Lang).localeCompare(langName(b.Lang));
      if(l !== 0) return l;
      return variantLabel(a.Foil, a.Variation).localeCompare(variantLabel(b.Foil, b.Variation));
    });

    var overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.addEventListener("click", function(e){
      if(e.target === overlay) closeAllModals();
    });

    var box = document.createElement("div");
    box.className = "modal-box";

    var closeBtn = document.createElement("button");
    closeBtn.className = "modal-close";
    closeBtn.setAttribute("aria-label", "Close");
    closeBtn.textContent = "×";
    closeBtn.addEventListener("click", closeAllModals);

    var title = document.createElement("h3");
    title.className = "modal-title";
    title.textContent = info.name;

    var table = document.createElement("table");
    var thead = document.createElement("thead");
    thead.innerHTML = "<tr><th>Set</th><th>Language</th><th>Variant</th></tr>";
    var tbody = document.createElement("tbody");

    rows.forEach(function(c){
      var tr = document.createElement("tr");

      var tdSet = document.createElement("td");
      tdSet.textContent = c.Set || "—";

      var tdLang = document.createElement("td");
      tdLang.textContent = langName(c.Lang);

      var tdVariant = document.createElement("td");
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "variant-link";
      btn.textContent = variantLabel(c.Foil, c.Variation);
      btn.addEventListener("click", function(){
        openCardModal(c.Code);
      });
      tdVariant.appendChild(btn);

      tr.appendChild(tdSet);
      tr.appendChild(tdLang);
      tr.appendChild(tdVariant);
      tbody.appendChild(tr);
    });

    table.appendChild(thead);
    table.appendChild(tbody);

    box.appendChild(closeBtn);
    box.appendChild(title);
    if(rows.length === 0){
      var empty = document.createElement("div");
      empty.className = "empty-note";
      empty.textContent = "No variants found for this art.";
      box.appendChild(empty);
    } else {
      box.appendChild(table);
    }

    overlay.appendChild(box);
    modalRoot.innerHTML = "";
    modalRoot.appendChild(overlay);
    lockScroll();
    closeBtn.focus();
  }

  function openCardModal(code){
    lastFocusedElement = document.activeElement || lastFocusedElement;
    var card = cards.find(function(c){ return c.Code === code; });
    if(!card){
      console.error("Card not found for code: " + code);
      return;
    }

    var info = artInfo((card.art_id || "").trim());

    var overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    overlay.addEventListener("click", function(e){
      if(e.target === overlay) closeAllModals();
    });

    var box = document.createElement("div");
    box.className = "modal-box";

    var closeBtn = document.createElement("button");
    closeBtn.className = "modal-close";
    closeBtn.setAttribute("aria-label", "Close");
    closeBtn.textContent = "×";
    closeBtn.addEventListener("click", closeAllModals);

    var title = document.createElement("h3");
    title.className = "modal-title";
    title.textContent = card.Code;

    var body = document.createElement("div");
    body.className = "card-modal-body";

    var imgWrap = document.createElement("div");
    imgWrap.className = "card-modal-img";
	var FALLBACK_IMAGE_URL = "https://raw.githubusercontent.com/Zeru64/pory/refs/heads/main/cards/porygont.png";
    if(card.URL){
      var img = document.createElement("img");
      img.src = card.URL;
      img.alt = card.Code + " card image";
      img.onerror = function(){
        img.onerror = null;
        img.src = FALLBACK_IMAGE_URL;
        img.alt = "Image unavailable";
      };
      imgWrap.appendChild(img);
    } else {
      var imgDefault = document.createElement("img");
      imgDefault.src = FALLBACK_IMAGE_URL;
      imgDefault.alt = "Image unavailable";
      imgWrap.appendChild(imgDefault);
    }

    var details = document.createElement("div");
    details.className = "card-modal-details";

    var fields = [
      ["Code", card.Code || "—"],
      ["Art", info.name],
      ["Art ID", card.art_id || "—"],
      ["Set", card.Set || "—"],
      ["Number", card.Num || "—"],
      ["Year", card.Year || "—"],
      ["Foil", card.Foil || "—"],
      ["Variation", card.Variation || "—"],
      ["Language", langName(card.Lang)],
      ["Status", statusName(card.Status)],
      ["Notes", card.Notes || "—"]
    ];

    fields.forEach(function(f){
      var row = document.createElement("div");
      row.className = "detail-row";
      var k = document.createElement("div");
      k.className = "k";
      k.textContent = f[0];
      var v = document.createElement("div");
      v.className = "v";
      v.textContent = f[1];
      row.appendChild(k);
      row.appendChild(v);
      details.appendChild(row);
    });

    body.appendChild(imgWrap);
    body.appendChild(details);

    box.appendChild(closeBtn);
    box.appendChild(title);
    box.appendChild(body);

    overlay.appendChild(box);
    modalRoot.innerHTML = "";
    modalRoot.appendChild(overlay);
    lockScroll();
    closeBtn.focus();
  }

  function escapeHtml(str){
    if(str === null || str === undefined) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  loadData();
})();
</script>

</body>
</html>
